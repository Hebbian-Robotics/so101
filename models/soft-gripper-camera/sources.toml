manufacturer_url = "https://www.hbvcamera.com/1MP-%20HD-usb-cameras/hbvcam-ov9732-1mp-hd-free-driver-face-recognition-camera-module.html"
mounting = "centered in square bracket; screws enter from the back"
connector_location = "rear of board, on the edge nearest the gripper"
collision_board_width_mm = 38.0
collision_front_reserve_mm = 16.05
collision_rear_reserve_mm = 6.2
collision_envelope_basis = "supplier module height reserved entirely in front; OEM board drawing rear connector projection reserved behind; flexible cable excluded"
sensor_resolution_description = "1MP / 720P"
