optical_frame_verified = false
image_rotation_verified = false
image_mirroring_verified = false

[camera_mount.gripper_interface]
description = "locating slot plus two coaxial screw pairs in the source assembly"
screw_axis_direction_in_assembly = [0.000001, -1.0, 0.000001]
