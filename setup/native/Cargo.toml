[package]
name = "so101"
version = "0.1.8"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
directories-next = "2"
hebbian-so101 = { path = "../../runtime" }
mime_guess = "2"
open = "5"
self_update = { version = "1.3.3", default-features = false, features = ["github", "ureq", "rustls", "compression-tar-gz", "checksums"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
ureq = { version = "3", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = "0.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
strip = true
