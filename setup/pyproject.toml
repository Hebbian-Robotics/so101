[project]
name = "hebbian-so101-setup"
version = "0.1.5"
description = "SO-101 calibration, model alignment and servo setup without a robot control stack"
readme = "README.md"
authors = [{ name = "Hebbian Robotics" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.20",
    "pydantic>=2.11",
    "pyserial>=3.5,<4",
    "rustypot>=1.13.1,<2",
    "tomli-w>=1.2,<2",
]

[project.scripts]
so101-calibrate = "so101_setup.server:command_line"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "so101_setup"
source-include = [
    "src/so101_setup/assets/**", "src/so101_setup/COORDINATES.md",
    "web/licenses/**", "web/src/**", "web/tools/*.ts", "web/web/**", "web/*.json", "web/vite.config.ts",
    "tools/*.py",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.2.0",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "C901", "UP", "ANN", "PTH", "RET", "SIM", "TID", "RUF", "PLE", "LOG", "PGH003", "PGH004", "PLW0108", "PLC3002", "PT010", "PT011", "PT012", "PT014", "PT016", "PT017", "PT018", "PT028", "PT030", "PT031", "ASYNC210", "ASYNC220", "ASYNC221", "ASYNC222", "ASYNC230", "ASYNC250", "ASYNC251"]
ignore = ["E501", "B008", "RET504", "ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "3 days"

[tool.ty.rules]
division-by-zero = "error"
deprecated = "error"
unused-ignore-comment = "error"
invalid-ignore-comment = "error"
ignore-comment-unknown-rule = "error"
possibly-unresolved-reference = "error"

[project.urls]
Repository = "https://github.com/Hebbian-Robotics/so101"
Documentation = "https://github.com/Hebbian-Robotics/so101#readme"

[tool.importlinter]
root_package = "so101_setup"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "setup configuration is independent of hardware and application adapters"
type = "forbidden"
source_modules = ["so101_setup.configuration"]
forbidden_modules = [
    "so101_setup.calibration", "so101_setup.device", "so101_setup.storage",
    "so101_setup.runtime", "so101_setup.server", "so101_setup.discovery",
    "rustypot", "serial", "filelock", "http", "socket", "subprocess",
]
