name: Release setup distributions
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check version, build and verify
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(uv version --project setup --short)"
          fi
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          uv sync --project setup --locked
          uv run --project setup pytest
          uv build --project setup --out-dir dist
          uv run --project setup python setup/tools/check-wheel.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/published-release.json"; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          published = json.loads((Path(os.environ["RUNNER_TEMP"]) / "published-release.json").read_text())
          expected = {path.name for path in Path("dist").iterdir() if path.is_file() and not path.name.startswith(".")}
          available = {asset["name"] for asset in published["assets"]}
          missing = expected - available
          if missing:
              raise SystemExit(f"Existing release is missing assets: {sorted(missing)}")
          print("Release assets already published; preserving their original bytes.")
          PY
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
