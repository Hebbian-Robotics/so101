name: Release SO-101 binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-assets:
    uses: ./.github/workflows/browser-assets.yml
  binaries:
    needs: browser-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-assets
          path: setup/src/so101_setup/assets/web
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: setup/native -> target
      - name: Build and package the executable
        shell: bash
        run: |
          cargo test --manifest-path setup/native/Cargo.toml --locked --release --all-features
          cargo build --manifest-path setup/native/Cargo.toml --locked --release
          binary=so101
          if [[ "$RUNNER_OS" == Windows ]]; then binary=so101.exe; fi
          mkdir -p package dist
          cp "setup/native/target/release/$binary" package/
          cp LICENSE NOTICE setup/src/so101_setup/assets/web/THIRD_PARTY_NOTICES.txt package/
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(package/"$binary" --version)" = "so101 ${GITHUB_REF_NAME#v}"
          fi
          package/"$binary" --help
          platform=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          architecture=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          tar -czf "dist/so101-${platform}-${architecture}.tar.gz" -C package .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: so101-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: so101-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/published-release.json"; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          published = json.loads((Path(os.environ["RUNNER_TEMP"]) / "published-release.json").read_text())
          expected = {path.name for path in Path("dist").glob("*.tar.gz")}
          missing = expected - {asset["name"] for asset in published["assets"]}
          if missing:
              raise SystemExit(f"Existing release is missing assets: {sorted(missing)}")
          print("Release assets already published; preserving their original bytes.")
          PY
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
