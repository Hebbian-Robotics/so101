name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.runtime == 'true' }}
      native: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.native == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            runtime:
              - 'runtime/**'
              - '.cargo/**'
              - '.github/workflows/**'
            native:
              - 'setup/native/**'
              - 'setup/web/**'
              - 'setup/src/so101_setup/assets/robot/**'
              - 'runtime/**'
              - '.cargo/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'biome.json'
              - '.nvmrc'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'LICENSE*'
              - 'NOTICE*'
  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtime -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format and lint once
        if: runner.os == 'Linux'
        run: |
          rustup component add clippy rustfmt
          cargo fmt --manifest-path runtime/Cargo.toml --check
          cargo install cargo-machete --version 0.9.2 --locked
          cargo machete --with-metadata --skip-target-dir runtime
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path runtime/Cargo.toml --config runtime/deny.toml --all-features --exclude-dev --locked check bans
          cargo clippy --manifest-path runtime/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Test runtime and documentation
        run: cargo test --manifest-path runtime/Cargo.toml --locked --all-features
  browser-assets:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/browser-assets.yml
  native-setup:
    needs: [changes, browser-assets]
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-assets
          path: setup/src/so101_setup/assets/web
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: setup/native -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format and lint once
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path setup/native/Cargo.toml --check
          cargo clippy --manifest-path setup/native/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Test the native CLI
        run: cargo test --manifest-path setup/native/Cargo.toml --locked --all-features
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          output: ${{ runner.temp }}/documentation-links.md
          args: --offline README.md CONTRIBUTING.md runtime/README.md setup/README.md setup/src/so101_setup/COORDINATES.md
